apiVersion: 1

providers:
  - name: statoshi
    orgId: 1
    folder: Statoshi
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 10
    options:
      # The dashboard JSON is mounted read-only from the repo, so every restart
      # picks up local edits without copying files around.
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
